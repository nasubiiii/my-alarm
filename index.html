
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>My Alarm</title>

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">

    <!-- ホーム画面 -->
    <section id="home-screen">
      <header class="app-header">
        <h1>My Alarm</h1>
        <button id="settings-btn" class="icon-btn"
                type="button">⚙</button>
      </header>

      <section class="clock-card">
        <p id="current-date"></p>
        <p id="current-time">00:00:00</p>
        <div class="next-alarm-info">
          <p>次のアラーム</p>
          <strong id="next-alarm-text">設定なし</strong>
          <p id="next-alarm-countdown"></p>
        </div>
      </section>

      <div class="section-header">
        <h2>アラーム</h2>
        <button id="add-alarm-btn" type="button">
          ＋ 追加
        </button>
      </div>

      <div id="alarm-list"></div>
    </section>

    <!-- アラーム編集画面 -->
    <section id="edit-screen" hidden>
      <header class="app-header">
        <button id="back-btn" class="icon-btn"
                type="button">←</button>
        <h2 id="edit-title">アラーム編集</h2>
        <span></span>
      </header>

      <div class="edit-form">
        <label for="edit-name">アラーム名</label>
        <input id="edit-name" type="text"
               maxlength="40"
               placeholder="例：仕事">

        <label for="edit-time">時刻</label>
        <input id="edit-time" type="time" required>

        <label>繰り返し</label>
        <div id="edit-weekdays"
             class="weekday-selector"></div>

        <label for="edit-sound">アラーム音</label>
        <div class="sound-row">
          <select id="edit-sound">
            <option value="bell">ベル</option>
            <option value="digital">デジタル</option>
            <option value="gentle">やさしい音</option>
          </select>
          <button id="preview-btn" type="button">
            ▶ 試聴
          </button>
        </div>

        <button id="save-alarm-btn"
                class="primary-btn" type="button">
          保存
        </button>

        <div id="edit-actions" class="edit-actions">
          <button id="duplicate-btn"
                  type="button">複製</button>
          <button id="delete-btn"
                  type="button">削除</button>
        </div>
      </div>
    </section>

    <!-- 設定画面：次STEPで拡張 -->
    <section id="settings-screen" hidden>
      <header class="app-header">
        <button id="settings-back-btn"
                class="icon-btn" type="button">←</button>
        <h2>設定</h2>
        <span></span>
      </header>

      <label class="setting-row">
        <span>次のアラームへ自動スクロール</span>
        <input id="auto-scroll" type="checkbox">
      </label>
    </section>
  </main>

  <!-- アラーム鳴動画面 -->
  <div id="ringing-panel" class="ringing-panel" hidden>
    <div class="ringing-content">
      <p>アラーム</p>
      <h2 id="ringing-time">07:00</h2>
      <p id="ringing-name"></p>
      <button id="stop-alarm-btn" type="button">
        ■ 停止
      </button>
    </div>
  </div>
</body>
</html>
