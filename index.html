
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>My Alarm</title>

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">

    <!-- ホーム画面 -->
    <section id="home-screen">
      <header class="app-header">
        <h1>My Alarm</h1><div class="header-tools"><button id="forecast-btn" class="icon-btn" aria-label="7日間の予定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18M7 14h2m3 0h2m3 0h1M7 17h2m3 0h2"/></svg></button><button id="groups-btn" class="icon-btn" aria-label="グループ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h5l3 3h6a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 9h18"/></svg></button>

        <button id="clock-mode-btn"
                class="icon-btn"
                type="button"
                aria-label="時計専用モード"
                title="時計専用モード">⛶</button>

        <button id="settings-btn" class="icon-btn"
                type="button">⚙</button></div>
      </header>

        <section class="clock-card">
        <p id="current-date"></p>

        <!-- ホーム画面のアナログ時計 -->
        <div id="home-analog-clock" class="analog-clock home-analog-clock" hidden>
            <div class="analog-clock-face">
            <div id="home-analog-markers"></div>

            <span class="clock-number number-12">12</span>
            <span class="clock-number number-3">3</span>
            <span class="clock-number number-6">6</span>
            <span class="clock-number number-9">9</span>

            <div id="home-analog-hour-hand" class="clock-hand hour-hand"></div>
            <div id="home-analog-minute-hand" class="clock-hand minute-hand"></div>
            <div id="home-analog-second-hand" class="clock-hand second-hand"></div>
            <div class="clock-center"></div>
            </div>
        </div>

        <p id="current-time">00:00:00</p>

        <div class="next-alarm-info" hidden>
          <p data-i18n="nextAlarm">次のアラーム</p>
          <strong id="next-alarm-text">設定なし</strong>
          <p id="next-alarm-countdown"></p>
        </div>
      </section>

      <div class="section-header">
        <h2 data-i18n="alarms">アラーム</h2>
        <button id="add-btn" type="button" data-i18n="add">
        ＋ 追加
        </button>
      </div>

        <div class="bulk-alarm-wrapper">
        <div class="bulk-alarm-header">
            <span id="bulk-alarm-status">一部ON</span>
        </div>

        <div class="bulk-alarm-actions" role="group"
            aria-label="アラームの一括操作">
            <button id="all-on-btn" type="button"
                    data-i18n="allOn">すべてON</button>
            <button id="all-off-btn" type="button"
                    data-i18n="allOff">すべてOFF</button>
        </div>
        </div>

      <div id="alarm-list"></div>
    </section>

    <!-- アラーム編集画面 -->
    <section id="edit-screen" hidden>
      <header class="app-header">
        <button id="back-btn" class="icon-btn"
                type="button">←</button>
        <h2 id="edit-title">アラーム編集</h2>
        <span></span>
      </header>

      <div class="edit-form">
        <label data-i18n="alarmName">アラーム名</label>
        <input id="edit-name" type="text"
               maxlength="40"
               placeholder="例：仕事">

        <label data-i18n="time">時刻</label>

        <div class="time-picker">
          <select id="edit-hour" aria-label="時"></select>
          <span class="time-separator">:</span>
          <select id="edit-minute" aria-label="分"></select>
          <select id="edit-ampm" aria-label="午前・午後" hidden>
            <option value="AM">AM</option>
            <option value="PM">PM</option>
          </select>
        </div>

        <label data-i18n="repeat">繰り返し</label>
        <div id="edit-weekdays"
             class="weekday-selector"></div>

        <label data-i18n="sound">アラーム音</label>
        <div class="sound-row">
            <select id="edit-sound">
            <option value="bell">ベル</option>
            <option value="digital">デジタル</option>
            <option value="gentle">やさしい音</option>
            <option value="classicBell">クラシックベル</option>
            <option value="chime">チャイム</option>
            <option value="piano">ピアノ</option>
            <option value="marimba">マリンバ</option>
            <option value="synth">シンセ</option>
            <option value="pulse">パルス</option>
            <option value="alert">アラート</option>
            </select>
            <button id="preview-btn" type="button" data-i18n="preview">
            ▶ 試聴
            </button>

        </div>

        <!-- スヌーズ -->
        <label class="setting-row">
          <span data-i18n="snooze">スヌーズ</span>
          <input id="edit-snooze" type="checkbox">
        </label>

        <label for="edit-snooze-minutes"
               data-i18n="snoozeInterval">
          スヌーズ間隔
        </label>
        <select id="edit-snooze-minutes">
          <option value="1">1分</option><option value="2">2分</option><option value="3">3分</option><option value="4">4分</option><option value="5">5分</option><option value="6">6分</option><option value="7">7分</option><option value="8">8分</option><option value="9">9分</option><option value="10">10分</option><option value="11">11分</option><option value="12">12分</option><option value="13">13分</option><option value="14">14分</option><option value="15">15分</option><option value="16">16分</option><option value="17">17分</option><option value="18">18分</option><option value="19">19分</option><option value="20">20分</option><option value="21">21分</option><option value="22">22分</option><option value="23">23分</option><option value="24">24分</option><option value="25">25分</option><option value="26">26分</option><option value="27">27分</option><option value="28">28分</option><option value="29">29分</option><option value="30">30分</option>
        </select>

        <label for="edit-snooze-count" data-i18n="snoozeCount">スヌーズ回数</label><select id="edit-snooze-count"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option><option value="0">無制限</option></select><label for="edit-group" data-i18n="group">グループ</label><select id="edit-group"></select>
        <!-- フェードイン -->
        <label class="setting-row">
          <span data-i18n="fadeIn">フェードイン</span>
          <input id="edit-fade-in" type="checkbox">
        </label>

        <!-- 次回だけスキップ -->
        <label class="setting-row">
          <span data-i18n="skipNext">次回だけスキップ</span>
          <input id="edit-skip-next" type="checkbox">
        </label>

        <button id="save-alarm-btn"
                class="primary-btn"
                type="button"
                data-i18n="save">
          保存
        </button>


            <div id="edit-actions" class="edit-actions">
            <button id="duplicate-btn"
                    type="button"
                    data-i18n="duplicate">複製</button>

            <button id="delete-btn"
                    type="button"
                    data-i18n="delete">削除</button>
            </div>
      </div>
    </section>


<!-- 設定画面 -->
<section id="settings-screen" hidden>
  <header class="app-header">
    <button id="settings-back-btn"
            class="icon-btn" type="button">←</button>
    <h2 data-i18n="settings">設定</h2>
    <span></span>
  </header>

  <div class="settings-group">
    <h3 data-i18n="appearance">外観</h3>

    <label for="theme-select" data-i18n="theme">
      テーマ
    </label>
    <select id="theme-select">
      <option value="system">端末設定に合わせる</option>
      <option value="light">ライト</option>
      <option value="dark">ダーク</option>
    </select>


    <label class="feature-check"><input id="scenic-background" type="checkbox"> <span data-feature="scenic">時間帯に合わせて風景背景を切り替える</span></label>
    <label class="feature-check"><input id="city-scenery" type="checkbox"> <span data-feature="city">世界時計の都市別背景を表示</span></label>
    <label for="background-select" data-i18n="backgroundTheme">
    背景テーマ
    </label>
    <select id="background-select">
    <option value="default">標準（表示モードに合わせる）</option>

    <optgroup label="ダーク系" data-group="dark">
        <option value="mauve">モーヴグレー</option>
        <option value="smokyBlue">スモーキーブルー</option>
        <option value="espresso">エスプレッソ</option>
        <option value="olive">ダークオリーブ</option>
        <option value="wine">ワインベルベット</option>
        <option value="charcoal">チャコールラテ</option>
    </optgroup>

    <optgroup label="ライト系" data-group="light">
        <option value="oatmeal">オートミール</option>
        <option value="lilac">ダスティライラック</option>
        <option value="mistBlue">ミストブルー</option>
        <option value="pistachio">ピスタチオミルク</option>
        <option value="rose">ローズミルク</option>
        <option value="greige">フレンチグレージュ</option>
    </optgroup>
    </select>

    <label for="accent-select" data-i18n="accent">
    アクセントカラー
    </label>
    <select id="accent-select">
    <option value="blue">ブルー</option>
    <option value="teal">ティール</option>
    <option value="purple">パープル</option>
    <option value="pink">ピンク</option>
    <option value="orange">オレンジ</option>
    </select>


    <label for="font-select" data-i18n="font">
      フォント
    </label>
    <select id="font-select">
      <option value="sans">Noto Sans JP</option>
      <option value="rounded">M PLUS Rounded 1c</option>
      <option value="serif">Noto Serif JP</option>
      <option value="mono">Roboto Mono</option>
    </select>
  </div>

  <div class="settings-group">
    <h3 data-i18n="languageHeading">言語</h3>

    <label for="language-select" data-i18n="language">
      表示言語
    </label>
    <select id="language-select">
      <option value="ja">日本語</option>
      <option value="en">English</option>
    </select>
  </div>


    <div class="settings-group">
    <h3 data-i18n="clockSettings">時計設定</h3>


    <label for="time-format-select" data-i18n="timeFormat">
        時刻表示形式
    </label>
    <select id="time-format-select">
        <option value="24">24時間表示</option>
        <option value="12">12時間表示</option>
    </select>

        <label for="home-clock-display-select" data-i18n="homeClockDisplay">
        ホーム画面の時計表示
        </label>
        <select id="home-clock-display-select">
        <option value="digital">デジタル</option>
        <option value="analog">アナログ</option>
        <option value="both">両方</option>
        </select>

        <label for="clock-display-select" data-i18n="clockDisplay">
        時計専用モードの表示
        </label>
        <select id="clock-display-select">
        <option value="digital">デジタル</option>
        <option value="analog">アナログ</option>
        <option value="both">両方</option>
        </select>


    <label class="setting-row">
        <span data-i18n="showSeconds">秒を表示する</span>
        <input id="show-seconds" type="checkbox" checked>
    </label>
    </div>

    <div class="settings-group">
    <h3 data-i18n="alarmSettings">アラーム設定</h3>


    <label class="setting-row">
      <span data-i18n="autoScroll">
        次のアラームへ自動スクロール
      </span>
      <input id="auto-scroll" type="checkbox">
    </label>
  </div>

  <!-- バックアップ・復元 -->
  <div class="settings-group">
    <h3 data-i18n="backupHeading">バックアップ・復元</h3>

    <button id="export-backup-btn" type="button"
            data-i18n="exportBackup">
      バックアップを保存
    </button>

    <button id="import-backup-btn" type="button"
            data-i18n="importBackup">
      バックアップから復元
    </button>

    <input id="backup-file-input"
           type="file"
           accept=".json,application/json"
           hidden>
  </div>
</section>

  <section id="world-screen" hidden><h2 data-i18n="world">世界時計</h2><div class="clock-card"><div class="world-local-heading"><p id="world-date"></p><select id="world-clock-display" aria-label="現在地の時計表示"><option value="digital">デジタル</option><option value="analog">アナログ</option><option value="both">両方</option></select></div><div id="world-analog-clock" class="analog-clock home-analog-clock" hidden aria-label="現在地のアナログ時計"><div class="analog-clock-face"><div id="world-analog-markers"></div><span class="clock-number number-12">12</span><span class="clock-number number-3">3</span><span class="clock-number number-6">6</span><span class="clock-number number-9">9</span><div id="world-analog-hour-hand" class="clock-hand hour-hand"></div><div id="world-analog-minute-hand" class="clock-hand minute-hand"></div><div id="world-analog-second-hand" class="clock-hand second-hand"></div><div class="clock-center"></div></div></div><p id="world-time"></p><p id="world-zone"></p><button id="world-full" data-i18n="full">全画面</button></div><div class="glass-panel"><button id="city-add" type="button" aria-haspopup="dialog" aria-label="都市を追加" title="都市を追加">＋</button><dialog id="city-picker" class="app-dialog city-picker"><div class="city-picker-header"><h3 id="city-picker-title"></h3><button id="city-picker-close" type="button" autofocus>×</button></div><input id="city-search" type="search" autocomplete="off"><div id="city-options" class="city-picker-list"></div></dialog><p id="city-message" role="status"></p><div id="city-list"></div></div><div class="glass-panel"><label id="travel-label" for="travel">時差比較</label><input id="travel" type="range" min="-1440" max="1440" step="15" value="0"><button id="travel-reset">Reset</button></div></section>
<dialog id="welcome-dialog" class="app-dialog welcome-dialog" aria-labelledby="welcome-heading"><div class="welcome-content"><div class="welcome-illustration" aria-hidden="true">◷</div><h2 id="welcome-heading"></h2><p id="welcome-description"></p><div id="welcome-dots" class="welcome-dots"></div><div class="welcome-controls"><button id="welcome-skip" type="button"></button><button id="welcome-next" type="button"></button></div></div></dialog>
<section id="timer-screen" hidden><h2 data-i18n="timer">タイマー</h2><div id="timer-types"></div><div id="timer-detail" class="glass-panel" hidden><button id="timer-back">←</button><div class="timer-detail-heading"><h3 id="timer-title"></h3><button id="preset-toggle" type="button" aria-label="保存済みタイマー" title="保存済みタイマー" aria-expanded="false" aria-controls="timer-presets">☆</button></div><div class="duration"><input id="timer-hours" type="number" min="0" max="99" value="0" aria-label="Hours">:<input id="timer-minutes" type="number" min="0" max="59" value="5" aria-label="Minutes">:<input id="timer-seconds" type="number" min="0" max="59" value="0" aria-label="Seconds"></div><p id="timer-value" class="big-time">00:05:00</p><progress id="timer-progress" max="1" value="1"></progress><div id="timer-art"></div><div id="timer-presets" class="preset-popover" hidden><div class="preset-heading"><h3 id="preset-heading">よく使うタイマー</h3><button id="preset-add" type="button">＋ 新規登録</button></div><div id="preset-list" class="preset-list"></div></div><div class="actions"><button id="timer-start"></button><button id="timer-reset"></button><button id="timer-save-preset" type="button" hidden>☆ 保存</button></div></div><dialog id="preset-dialog" class="app-dialog preset-dialog"><h3 id="preset-dialog-heading">タイマーを保存</h3><label id="preset-name-label" for="preset-name">名前</label><input id="preset-name" maxlength="40" placeholder="カップ麺"><label id="preset-duration-label">時間</label><div class="duration"><input id="preset-hours" type="number" min="0" max="99" value="0" aria-label="Hours">:<input id="preset-minutes" type="number" min="0" max="59" value="3" aria-label="Minutes">:<input id="preset-seconds" type="number" min="0" max="59" value="0" aria-label="Seconds"></div><label id="preset-kind-label" for="preset-kind" hidden>表示タイプ</label><select id="preset-kind" hidden></select><div class="dialog-actions"><button id="preset-cancel" type="button">キャンセル</button><button id="preset-save" type="button" class="dialog-primary">保存</button></div></dialog></section>
<section id="stopwatch-screen" hidden><h2 data-i18n="stopwatch">ストップウォッチ</h2><div class="glass-panel"><p id="sw-value" class="big-time">00:00:00.0</p><div class="actions"><button id="sw-start"></button><button id="sw-lap"></button><button id="sw-reset"></button></div><div id="sw-laps"></div></div><details class="glass-panel"><summary id="sw-history-title"></summary><div id="sw-history"></div></details></section>
<section id="forecast-screen" hidden><button class="return-home" data-i18n="back">戻る</button><h2 data-i18n="forecast">7日間の予定</h2><div id="forecast-list"></div></section>
<section id="groups-screen" hidden><button class="return-home" data-i18n="back">戻る</button><h2 data-i18n="groups">グループ管理</h2><input id="group-name" maxlength="40" aria-label="Group name"><button id="group-add" data-i18n="add">追加</button><div id="group-list"></div></section>
<nav id="tab-nav" aria-label="Navigation"><button type="button" data-tab="home" data-i18n="alarms">アラーム</button><button type="button" data-tab="world" data-i18n="world">世界時計</button><button type="button" data-tab="timer" data-i18n="timer">タイマー</button><button type="button" data-tab="stopwatch" data-i18n="stopwatch">ストップウォッチ</button><button type="button" data-tab="settings" data-i18n="other">その他</button></nav></main>

  <!-- 時計専用モード -->
  <section id="clock-mode-screen" hidden>
    <button id="clock-mode-back-btn"
            class="icon-btn"
            type="button"
            aria-label="戻る">×</button>


    <div class="clock-mode-content">
      <p id="clock-mode-date"></p>

      <!-- アナログ時計 -->
      <div id="analog-clock" class="analog-clock" hidden>
        <div class="analog-clock-face">
          <div id="analog-markers"></div>

          <span class="clock-number number-12">12</span>
          <span class="clock-number number-3">3</span>
          <span class="clock-number number-6">6</span>
          <span class="clock-number number-9">9</span>

          <div id="analog-hour-hand" class="clock-hand hour-hand"></div>
          <div id="analog-minute-hand" class="clock-hand minute-hand"></div>
          <div id="analog-second-hand" class="clock-hand second-hand"></div>
          <div class="clock-center"></div>
        </div>
      </div>

      <!-- デジタル時計 -->
      <p id="clock-mode-time">00:00:00</p>

      <div class="clock-mode-next">

        <p data-i18n="nextAlarm">次のアラーム</p>
        <strong id="clock-mode-next-alarm">設定なし</strong>
        <p id="clock-mode-countdown"></p>
      </div>
    </div>
  </section>

  <!-- アラーム鳴動画面 -->
  <div id="ringing-panel" class="ringing-panel" hidden>

    <div class="ringing-content">
      <p>アラーム</p>
      <h2 id="ringing-time">07:00</h2>
      <p id="ringing-name"></p>
        <div class="ringing-actions">
          <button id="snooze-alarm-btn"
                  type="button"
                  data-i18n="snoozeNow">
            スヌーズ
          </button>

          <button id="stop-alarm-btn"
                  type="button"
                  data-i18n="stop">
            ■ 停止
          </button>
        </div>
    </div>
  </div>
</body>
</html>
